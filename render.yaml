# Render Blueprint — Agenda Expert (banco de dados no Supabase)
# Em render.com: New + → Blueprint → escolha este repositório do GitHub.
services:
  - type: web
    name: agenda-expert
    runtime: node
    region: virginia            # mais próxima do Brasil entre as regiões do Render
    plan: free                  # os dados ficam no Supabase, então o plano grátis serve
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # publica sozinho a cada push no GitHub
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ADMIN_NAME
        value: Esther Lino
      - key: ADMIN_EMAIL
        sync: false             # o Render pede o valor na criação (não fica no GitHub)
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL       # connection string do Supabase (Session pooler)
        sync: false
